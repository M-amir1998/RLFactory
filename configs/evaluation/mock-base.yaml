# rlfactory evaluate configs/evaluation/mock-base.yaml
name: mock-base-eval
label: base
suites: [eval-heldout]
policy:
  kind: mock
  policy_id: mock-base
  seed: 1
  profile: {correct_probability: 0.55, malformed_probability: 0.12}
evaluation:
  samples_per_task: 4
  generation: {temperature: 0.7, max_tokens: 512}
  pass_at_k: [1, 2, 4]
sandbox: {kind: subprocess, limits: {wall_time_s: 5, memory_mb: 256}}
