# Tiny local CPU smoke run (wiring check only, never a result). Needs the 'trl' extra and
# HuggingFaceTB/SmolLM2-135M-Instruct already in the local Hugging Face cache.
name: trl-sft-cpu-smoke
backend: trl
method: sft
model: {name: HuggingFaceTB/SmolLM2-135M-Instruct}
dataset_dir: results/datasets/mock-train-mixed-sft
trl: {cpu_smoke: true}
config:
  max_steps: 2
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 1
  logging_steps: 1
  save_steps: 1000
  lora: {r: 4, alpha: 8}
  method_params: {method: sft, max_length: 256}
