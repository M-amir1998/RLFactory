# pre-commit install  (hooks reuse the uv-locked tool versions where possible)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=512"]
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: secret-scan
        name: secret scan
        entry: uv run python scripts/secret_scan.py
        language: system
        pass_filenames: false
      - id: repo-hygiene
        name: repository hygiene
        entry: uv run python scripts/check_repo_hygiene.py
        language: system
        pass_filenames: false
