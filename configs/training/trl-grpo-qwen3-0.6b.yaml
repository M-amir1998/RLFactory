# Remote GPU run (TRL 1.18). Before launching:
#  1. re-check the model card licence (Apache-2.0 at verification time, 2026-11-14);
#  2. pin revision to a commit SHA (https://huggingface.co/api/models/Qwen/Qwen3-0.6B -> "sha");
#  3. rlfactory train <this file> --dry-run  (memory estimate), then rlfactory remote launch.
name: trl-grpo-qwen3-0.6b
backend: trl
method: grpo
model: {name: Qwen/Qwen3-0.6B, revision: null, dtype: bfloat16, trust_remote_code: false}
dataset_dir: results/datasets/mock-train-mixed-grpo
trl: {num_processes: 1, mixed_precision: bf16}
config:
  learning_rate: 1.0e-6
  num_train_epochs: 1
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  gradient_checkpointing: true
  bf16: true
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  logging_steps: 5
  save_steps: 100
  lora: {enabled: true, r: 16, alpha: 32, dropout: 0.05, target_modules: all-linear, quantization: none}
  method_params: {method: grpo, num_generations: 8, max_completion_length: 1024, beta: 0.0, loss_type: dapo, scale_rewards: group, use_vllm: true, vllm_mode: colocate, vllm_gpu_memory_utilization: 0.35, reward_functions: [{component: correctness, weight: 1.0}, {component: format, weight: 0.1}]}
